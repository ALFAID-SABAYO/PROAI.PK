# PropAI.pk — run entire stack with: docker compose up --build
# First start: migrations + ML training + DB seed (may take 5-15 minutes)

services:
  db:
    image: postgres:16-alpine
    container_name: propai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: propai
      POSTGRES_PASSWORD: propai
      POSTGRES_DB: propai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propai -d propai"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: propai-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://propai:propai@db:5432/propai
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-docker}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DATASET_PATH: /data/zameen-updated.csv
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_LIMIT: ${SEED_LIMIT:-5000}
    volumes:
      # Writable folder for dataset uploads (do not bind a single CSV file — read-only on Windows Docker)
      - ./data:/data
      # Seed copy on first run if /data/zameen-updated.csv is missing
      - ./zameen-updated.csv:/seed/zameen-updated.csv:ro
      # Persist trained model between restarts (optional but faster restarts)
      - ml_artifacts:/app/app/ml/artifacts
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: propai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  ml_artifacts:
